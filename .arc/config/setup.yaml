components:
  comp_core_api:
    mode: local
    e2e_command: cd services/api && uv run pytest tests/e2e
    test_command: cd services/api && uv run pytest tests/unit
    build_command: cd services/api && sh scripts/build.sh
    start_command: cd services/api && uv run uvicorn app.main:app --host {host} --port {port}
    port_env: COMP_CORE_API_PORT
    base_port: 8000
    ready_check:
      url: http://localhost:{port}/
    install_command: cd services/api && uv add {requirement}
  comp_web_app:
    mode: local
    e2e_command: cd apps/web && pnpm e2e
    test_command: cd apps/web && pnpm test
    build_command: cd apps/web && pnpm build
    start_command: cd apps/web && pnpm exec vite --host {host} --port {port} --strictPort
    devloop_command: cd apps/web && pnpm devloop
    port_env: COMP_WEB_APP_PORT
    base_port: 5173
    ready_check:
      url: http://localhost:{port}/
    primary: true
    install_command: cd apps/web && pnpm add {name}@{version}
commands:
  test: (cd services/api && uv run pytest tests/unit) && (cd apps/web && pnpm test)
  build: (cd services/api && sh scripts/build.sh) && (cd apps/web && pnpm build)
  devloop: cd apps/web && pnpm devloop
  test_fast_args: --lf --no-header
ui_tests:
  framework: playwright
  command: cd apps/web && pnpm exec playwright test
setup_command: (cd apps/web && pnpm install --frozen-lockfile) && (cd services/api && uv sync)
toolchain:
  node: '22'
  pnpm: 12.9.1
  python: '3.12'
package_install_commands:
  pnpm: pnpm add {name}@{version}
  uv: uv add {requirement}
